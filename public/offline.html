<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101828" />
  <title>PesaMali · Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(circle at 18% 18%, rgba(34,197,94,.18), transparent 30%),
        radial-gradient(circle at 84% 18%, rgba(21,94,239,.26), transparent 34%),
        linear-gradient(135deg, #F8FBFF 0%, #EAF7FF 42%, #E8FFF5 100%);
      color: #101828;
    }
    .shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: min(100%, 440px);
      padding: 12px 8px;
    }
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .logo {
      display: block;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 10px 28px rgba(21,94,239,.16);
    }
    .brand-name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #101828;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 999px;
      background: #EAF1FF;
      border: 1px solid #D1E0FF;
      color: #155EEF;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 22px;
    }
    h1 {
      font-size: clamp(30px, 7vw, 42px);
      line-height: 1.08;
      font-weight: 820;
      letter-spacing: -0.4px;
      margin: 0 0 14px;
      color: #0B1220;
    }
    h1 .grad {
      background: linear-gradient(90deg, #155EEF 0%, #06B6D4 52%, #10B981 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 15px;
      color: #475467;
      line-height: 1.65;
      margin: 0 0 28px;
      max-width: 36ch;
    }
    button {
      border: none;
      border-radius: 12px;
      padding: 13px 30px;
      background: #101828;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(16,24,40,.18);
      transition: transform .15s ease;
    }
    button:active { transform: scale(.97); }
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand">
      <img class="logo" src="/icon-192.png" alt="PesaMali" width="64" height="64" />
      <span class="brand-name">PesaMali</span>
    </div>

    <div class="badge" aria-live="polite">
      <span aria-hidden="true">✦</span>
      You're offline
    </div>

    <h1>No internet, <span class="grad">no worries</span>.</h1>
    <p>Your numbers are safe. Reconnect to sync the latest, or go back to a page you visited recently.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    addEventListener('online', () => location.reload())
  </script>
</body>
</html>
